# Runs the same checks as `npm run check`. No speech models and no generated audio are needed:
# tests use mock speech providers, and content validation works on the JSON files alone.
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run content:validate
